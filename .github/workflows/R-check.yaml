name: R package and worked examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      R_LIBS_USER: ${{ github.workspace }}/.ci-library
    steps:
      - uses: actions/checkout@v7
      - name: Install R and recommended packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y r-base r-recommended
          mkdir -p "$R_LIBS_USER"
      - name: Build and check
        run: |
          R CMD build . --no-build-vignettes
          R CMD check --no-manual --no-build-vignettes CrossDomainAdjust_*.tar.gz
          grep -q 'Status: OK' CrossDomainAdjust.Rcheck/00check.log
      - name: Install and run all 15 examples
        run: |
          R CMD INSTALL --library="$R_LIBS_USER" CrossDomainAdjust_*.tar.gz
          Rscript -e 'source(system.file("examples", "run_all.R", package="CrossDomainAdjust"))'
